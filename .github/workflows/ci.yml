# CI — the gauntlet Converge asks of everyone else.
#
# A method whose pitch is "the eval decides done" has to run its own evals in
# public. The test bodies are credential-free and service-isolated: no live
# tracker, no model engine, and no external writes. Bootstrap may fetch
# validation dependencies. Suites that need a live Linear board are NOT run
# here by design — a gate that needs a secret is a gate that silently skips on
# a fork's PR, and a silently-skipped gate is worse than no gate.
name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: gauntlet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Optional reference-consumer dependencies remain optional for local
      # users. In CI, missing schema or cross-engine proof is a hard failure.
      TASK_SPEC_REQUIRE_JSONSCHEMA: "1"
      TASK_SPEC_STRICT_CROSS_ENGINE: "1"
    # macOS ships bash 3.2 and BSD userland; Linux ships bash 5 and GNU. The
    # core is written for the older, stricter of the two, so both must pass or
    # the portability claim is decoration.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The real-project acceptance test verifies one append-only
          # historical path-policy replay against its exact base and head.
          # A depth-1 checkout would make that evidence unverifiable.
          fetch-depth: 0
          # No step pushes or fetches private content after checkout.
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: install locked Python validation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          -r .github/requirements-ci.txt

      - name: set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: skills/task-spec/references/examples/package-lock.json

      - name: actionlint
        if: runner.os == 'Linux'
        # Go's module checksum database verifies this exact released module.
        # Keep workflow lint independent of another wrapper action.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: bash version (portability floor is 3.2)
        run: bash --version | head -1

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install shellcheck
            else
              sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            fi
          fi
          files=(bin/cvg install.sh)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find skills tests -type f -name '*.sh' -print0)
          shellcheck -S error "${files[@]}"

      - name: every skill is valid
        # Print WHY, not just which. Discarding the validator's output made all
        # all skills report a bare "INVALID" on macOS — the real cause was one
        # ImportError (PyYAML is absent on that image), and the log said nothing
        # about it. A gate that hides its own reason costs a round-trip to
        # diagnose and teaches you to distrust it.
        run: |
          fail=0
          indent() {
            while IFS= read -r line; do
              printf '    %s\n' "$line"
            done <<< "$1"
          }
          for d in skills/*/; do
            [ -f "$d/SKILL.md" ] || continue
            if ! out="$(python3 skills/skill-creator/scripts/quick_validate.py "$d" 2>&1)"; then
              echo "INVALID: $d"; indent "$out"; fail=1
            elif [ "$out" != "Skill is valid!" ]; then
              echo "INVALID: $d"; indent "$out"; fail=1
            fi
          done
          exit $fail

      - name: syntax — every shell script parses
        run: |
          fail=0
          for file in bin/cvg install.sh; do
            bash -n "$file" || { echo "SYNTAX: $file"; fail=1; }
          done
          while IFS= read -r -d '' file; do
            bash -n "$file" || { echo "SYNTAX: $file"; fail=1; }
          done < <(find skills tests -type f -name '*.sh' -print0)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: task-spec
        run: bash skills/task-spec/tests/test-task-spec-skill.sh

      - name: hmac envelope
        run: bash skills/task-spec/tests/test-hmac-envelope.sh

      - name: bash 3.2 portability
        run: bash skills/task-spec/tests/test-bash-portability.sh

      - name: runtime contract (Pass 7)
        run: bash skills/task-to-runtime-contract/tests/run-tests.sh

      - name: register (Pass 6, offline)
        run: bash skills/task-specs-to-issues/tests/test-register.sh

      - name: cvg json envelope
        run: bash tests/test-cvg-json-envelope.sh

      - name: install surface
        run: bash tests/test-install.sh

      - name: clean-room install — empty repo to settled task
        # Builds a throwaway Git repository, installs pinned copies for
        # Codex/Kimi/Claude, initializes the control plane, and proves the full
        # task/profile/loop/acceptance/receipt/state chain with a stub engine.
        run: bash tests/test-clean-room-install-e2e.sh

      - name: loop kernel (Pass 8) — the brakes
        # Hermetic: stub engines only. No model is called and no token spent, so
        # the result cannot drift with a vendor CLI's behaviour.
        run: bash tests/test-loop-kernel.sh

      - name: one package, one version
        run: bash tests/test-version-unity.sh

      - name: pass gates (0-4 · the design half)
        # Every pass gate that HAS a suite runs here. Pass 3 and Pass 4 owned
        # working suites that CI never invoked, so they could have rotted silently
        # for weeks — and Pass 4 is THE BARRIER, the last human sign-off. A test
        # that exists but never runs is worse than a missing one: it reads as
        # coverage on the tin.
        run: |
          bash skills/idea-to-brd/tests/run-tests.sh
          bash skills/brd-docs-to-tech-req/tests/run-tests.sh
          bash skills/tech-req-to-adrs/tests/run-tests.sh
          bash skills/reqs-to-swimlane-plans/tests/run-tests.sh
          bash skills/sketch-plans-adversarial-review/tests/run-tests.sh

      - name: task-spec — the rest of the engine's own suites
        run: |
          bash skills/task-spec/tests/test-effort-sizing.sh
          bash skills/task-spec/tests/test-extractor-fuzz.sh
          bash skills/task-spec/tests/test-portability-e2e.sh
          bash skills/task-spec/tests/test-v3-closed-loop-e2e.sh

      - name: companions (teaching · skill-creator)
        run: |
          bash skills/pass-to-lesson/tests/run-tests.sh
          bash skills/skill-creator/tests/test-skill-creator.sh

      - name: task-spec doc consistency
        # A LINT, not a suite — so the coverage gate below cannot see it. It is
        # wired by hand because it earned it: it caught plugin.json and
        # marketplace.json still claiming 3.6.0 after the version unification,
        # which every suite in the package had missed.
        run: bash skills/task-spec/scripts/lint-skill-docs.sh

      - name: every suite in the package is wired into this workflow
        # The gate that keeps this list honest. Without it the next suite someone
        # adds is invisible to CI by default, which is exactly how the four above
        # came to be unrun.
        run: bash tests/test-ci-covers-every-suite.sh

      - name: gate policy — hermetic unit + Git-integration suite
        # A Python suite, so the shell-suite coverage gate above cannot see it;
        # wired by hand like the doc lint. It proves parse_gate and the two
        # checkers refuse what they must, in a throwaway repo.
        run: python3 skills/task-to-runtime-contract/tests/test-gate-policy.py

      - name: the repo write fence is parseable and active
        # A gate that stops parsing is a fence that silently disappears.
        run: |
          python3 skills/task-to-runtime-contract/scripts/check-gate.py --repo . | tail -3
          python3 skills/task-to-runtime-contract/scripts/check-gate.py --repo . \
            --path auth/x.py >/dev/null && { echo "gate failed to refuse auth/"; exit 1; } || true
          echo "gate refuses what it must"

      - name: removed proving grounds cannot remain dependencies
        run: |
          needle='uc-''analytics'
          hits="$(
            git grep -n "$needle" -- . \
              ':(exclude)CHANGELOG.md' 2>/dev/null || true
            while IFS= read -r -d '' file; do
              grep -InH "$needle" "$file" 2>/dev/null || true
            done < <(git ls-files --others --exclude-standard -z)
          )"
          if [ -n "$hits" ]; then
            echo "live repository content still references the removed proving ground:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "clean — no shipped or intentionally untracked path depends on the removed proving ground"
